name: Update catalog.json
on:
  release:
    types: [published, created, edited, deleted]
  push:
    branches: [main]
    paths: [names.json, jamats.json, scripts/build_catalog.py]
  schedule:
    - cron: "*/30 * * * *"   # API upload of assets fires no event, so re-check every 30 min
  workflow_dispatch:
concurrency:
  group: catalog
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "catalog: auto update [skip ci]"
            git pull --rebase origin main && git push
          else
            echo "no change"
          fi
